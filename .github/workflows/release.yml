name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release gate: the full CI suite (workspace lib + CLI tests on three
  # OSes, the desktop app, clippy, fmt, docs, cargo-audit, cargo-vet,
  # MSRV, and the filesystem matrix) must pass on the exact tagged commit
  # before any artifact is built. rust.yml runs on branch pushes; invoking
  # it here as a reusable workflow makes a green tag mean the suite passed
  # on that commit, not merely on some earlier branch push.
  verify:
    uses: ./.github/workflows/rust.yml

  # Release gate: a tag push cannot publish artifacts unless the fuzz
  # parser-surface targets pass. The per-target budget is 60s here — a
  # tougher pre-ship check than the 20s branch/PR budget in rust.yml.
  # Builds on every release, so any newly-discovered crash blocks shipping.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 60

  # Release gate: the desktop app is excluded from the workspace, so its version
  # is not kept in lockstep by cargo-release's shared-version. Verify it matches
  # the pushed tag and fail the release on drift, instead of silently shipping an
  # app whose displayed version is stale.
  desktop-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify desktop version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version = ' ferrocrypt-desktop/Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::ferrocrypt-desktop version ($manifest) does not match release tag ($tag). Bump ferrocrypt-desktop/Cargo.toml before tagging."
            exit 1
          fi
          echo "ferrocrypt-desktop version $manifest matches tag $tag."

  # Release gate: the >4 GiB round-trip test is too slow and disk-hungry
  # (minutes and ~8 GiB of scratch) for every push, so it runs only here,
  # before a tag ships. It is the only test that moves more than u32::MAX
  # bytes through real I/O, so it is the only check that catches a u32/usize
  # truncation in the size or progress accounting above 4 GiB. Ubuntu-only:
  # hosted ubuntu runners have the disk headroom, and macOS/Windows runners
  # are tighter and slower.
  large-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Reclaim ~15 GiB of preinstalled toolchains this job never uses, so the
      # ~8 GiB payload plus the release build fit the runner disk with margin.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Run the >4 GiB round-trip test
        run: cargo test --release -p ferrocrypt --test large_file -- --ignored --test-threads=1

  build:
    needs: [verify, fuzz, desktop-version, large-file]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      # ── CLI (workspace member) ──────────────────────────────────────────

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p ferrocrypt-cli

      # ── Desktop app (excluded from workspace) ──────────────────────────

      # macOS / Linux desktop bundling via cargo-bundle (.app / .deb).
      # cargo-bundle's Windows MSI backend is unimplemented, so Windows uses
      # cargo-wix instead (separate step below).
      - name: Bundle Desktop (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: ferrocrypt-desktop
        run: cargo bundle --release --target ${{ matrix.target }}

      # cargo bundle leaves the .app with a linker-injected ad-hoc signature
      # whose CodeDirectory claims to seal bundle resources but doesn't, so
      # macOS refuses it with "damaged" instead of the usual "unidentified
      # developer" prompt. Re-sign ad-hoc to seal resources properly; users
      # then get the standard Open Anyway flow via Privacy & Security.
      # Proper Developer ID + notarization is the longer-term fix.
      - name: Re-sign Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - \
            ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx/FerroCrypt.app

      # Windows desktop bundling via cargo-wix (uses the WiX Toolset 3 that's
      # pre-installed on GitHub windows-latest runners). The WiX project lives
      # at ferrocrypt-desktop/wix/main.wxs and was generated with `cargo wix
      # init`.
      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked

      - name: Bundle Desktop (Windows MSI)
        if: runner.os == 'Windows'
        working-directory: ferrocrypt-desktop
        run: cargo wix --target ${{ matrix.target }} --nocapture

      # ── Package ─────────────────────────────────────────────────────────

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ferrocrypt-cli-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ferrocrypt

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ferrocrypt-cli-${{ matrix.target }}.zip \
            ./target/${{ matrix.target }}/release/ferrocrypt.exe

      - name: Package Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          cd ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx
          zip -r "$GITHUB_WORKSPACE/FerroCrypt-${{ matrix.target }}.zip" FerroCrypt.app

      - name: Package Desktop (linux)
        if: runner.os == 'Linux'
        run: cp ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb FerroCrypt-${{ matrix.target }}.deb

      - name: Package Desktop (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp ferrocrypt-desktop/target/wix/*.msi FerroCrypt-${{ matrix.target }}.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferrocrypt-${{ matrix.target }}
          path: |
            ferrocrypt-cli-${{ matrix.target }}.*
            FerroCrypt-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ferrocrypt-cli-*
            FerroCrypt-*
