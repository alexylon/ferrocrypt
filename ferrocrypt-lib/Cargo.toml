[package]
name = "ferrocrypt"
version = "0.3.0-rc.2"
edition = "2021"
rust-version = "1.87"

description = "Recipient-oriented file and directory encryption: passphrase (Argon2id) and X25519 public-key recipients, XChaCha20-Poly1305 STREAM payloads, HKDF-SHA3-256 / HMAC-SHA3-256 key derivation and authentication."
authors = ["Alexander Alexandrov"]
license = "GPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/alexylon/ferrocrypt"
homepage = "https://www.ferrocrypt.app"
documentation = "https://docs.rs/ferrocrypt"
keywords = ["cryptography", "encryption", "chacha20poly1305", "argon2", "X25519"]
categories = ["cryptography"]
publish = true
# Internal regression fixtures (including a non-secret fixture private.key)
# are not part of the published crate; they exist only to drive in-tree
# integration tests.
exclude = ["tests/fixtures/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Re-exports internal parser surfaces for the in-repo fuzz targets. Not
# part of the public API — enabled only by `ferrocrypt-lib/fuzz`.
fuzzing = []

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
secrecy = "0.10"
thiserror = "2"
chacha20poly1305 = { version = "0.10", features = ["std", "stream"] }
argon2 = { version = "0.5", features = ["std", "zeroize"] }
# hmac 0.13 and hkdf 0.13 require sha3 0.11. The `zeroize` features wipe
# the SHA3 sponge state and the HMAC input buffer on drop; hkdf has no
# feature of its own, but it holds an `Hmac` internally, so the same
# features cover its PRK state.
sha3 = { version = "0.11", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
hkdf = "0.13"
# Pin to the 0.4.2 floor (MSRV 1.85) and exclude 0.5 (MSRV 1.95) so the crate's 1.87 MSRV holds.
constant_time_eq = ">=0.4.2, <0.5"
bech32 = "0.11"
tempfile = "3"
# Capability-based filesystem primitives for the unified hardened
# extractor (`archive/platform.rs`). Used on every target — the
# extractor is no longer cfg-gated. cap-std provides directory-handle-
# rooted operations on Linux / macOS / Windows; cap-fs-ext adds the
# `open_dir_nofollow` and `OpenOptionsFollowExt::follow(FollowSymlinks::No)`
# primitives the extractor needs to refuse symlinks at every component.
cap-std = "4"
cap-fs-ext = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rustix is the safe-Rust syscall wrapper used by `archive/platform.rs`
# for handle-relative decrypt promotion on Linux / macOS. It also keeps
# `fs/atomic.rs`'s path-based `rename_no_clobber` implementation compiled
# for tests even though archive decrypt promotion no longer calls that
# helper on these targets. cap-std also pulls rustix transitively, so the
# version constraint is shared.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
ferrocrypt-test-support = { path = "../ferrocrypt-test-support" }
ctor = "0.9"
stats_alloc = "0.1.10"

# `process` enables the safe get/setrlimit wrappers used by the
# wide-tree fd-limit regression test in `archive/encode.rs`.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1", features = ["process"] }
