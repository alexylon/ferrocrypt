name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release gate: a tag push cannot publish artifacts unless the fuzz
  # parser-surface targets pass. Builds on every release, so any newly-
  # discovered crash blocks shipping.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 10

  build:
    needs: fuzz
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      # ── CLI (workspace member) ──────────────────────────────────────────

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p ferrocrypt-cli

      # ── Desktop app (excluded from workspace) ──────────────────────────

      # macOS / Linux desktop bundling via cargo-bundle (.app / .deb).
      # cargo-bundle's Windows MSI backend is unimplemented, so Windows uses
      # cargo-wix instead (separate step below).
      - name: Bundle Desktop (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: ferrocrypt-desktop
        run: cargo bundle --release --target ${{ matrix.target }}

      # cargo bundle leaves the .app with a linker-injected ad-hoc signature
      # whose CodeDirectory claims to seal bundle resources but doesn't, so
      # macOS refuses it with "damaged" instead of the usual "unidentified
      # developer" prompt. Re-sign ad-hoc to seal resources properly; users
      # then get the standard Open Anyway flow via Privacy & Security.
      # Proper Developer ID + notarization is the longer-term fix.
      - name: Re-sign Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - \
            ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx/FerroCrypt.app

      # Windows desktop bundling via cargo-wix (uses the WiX Toolset 3 that's
      # pre-installed on GitHub windows-latest runners). The WiX project lives
      # at ferrocrypt-desktop/wix/main.wxs and was generated with `cargo wix
      # init`.
      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked

      - name: Bundle Desktop (Windows MSI)
        if: runner.os == 'Windows'
        working-directory: ferrocrypt-desktop
        run: cargo wix --target ${{ matrix.target }} --nocapture

      # ── Package ─────────────────────────────────────────────────────────

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ferrocrypt-cli-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ferrocrypt

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ferrocrypt-cli-${{ matrix.target }}.zip \
            ./target/${{ matrix.target }}/release/ferrocrypt.exe

      - name: Package Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          cd ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx
          zip -r "$GITHUB_WORKSPACE/FerroCrypt-${{ matrix.target }}.zip" FerroCrypt.app

      - name: Package Desktop (linux)
        if: runner.os == 'Linux'
        run: cp ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb FerroCrypt-${{ matrix.target }}.deb

      - name: Package Desktop (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp ferrocrypt-desktop/target/wix/*.msi FerroCrypt-${{ matrix.target }}.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrocrypt-${{ matrix.target }}
          path: |
            ferrocrypt-cli-${{ matrix.target }}.*
            FerroCrypt-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ferrocrypt-cli-*
            FerroCrypt-*
