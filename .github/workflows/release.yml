name: Release

on:
  push:
    tags:
      - "v*"

# A job that needs more than reading asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The crates the release publishes: every workspace crate that can be
  # published, which the `version` job checks. The publish job builds nothing,
  # so the `package` job builds every crate named here.
  PUBLISHED_CRATES: ferrocrypt ferrocrypt-cli

jobs:
  # Release gate: the full CI suite (workspace lib + CLI tests on three
  # OSes, the desktop app, clippy, fmt, docs, cargo-audit, cargo-vet,
  # MSRV, and the filesystem matrix) must pass on the exact tagged commit
  # before any artifact is built. rust.yml runs on branch pushes; invoking
  # it here as a reusable workflow makes a green tag mean the suite passed
  # on that commit, not merely on some earlier branch push.
  verify:
    uses: ./.github/workflows/rust.yml

  # Release gate: a tag push cannot publish artifacts unless the fuzz
  # parser-surface targets pass. The per-target budget is 60s here — a
  # tougher pre-ship check than the 20s branch/PR budget in rust.yml.
  # Builds on every release, so any newly-discovered crash blocks shipping.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 60

  # Release gate: the tag must name the version of every crate the release
  # publishes and of the desktop app it packages, and a published crate that
  # depends on another must require that version of it. The desktop app is
  # excluded from the workspace, so cargo-release's shared-version does not
  # update it; a rule in ferrocrypt-lib/release.toml rewrites it, and this
  # check fails the release on drift instead of shipping installers that carry
  # an old version.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Check that the tag names every version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          metadata="$(cargo metadata --no-deps --format-version 1)"
          if ! jq --exit-status --arg crates "$PUBLISHED_CRATES" '
              ([.packages[] | select(.publish != []) | .name] | sort)
              == ($crates | split(" ") | map(select(length > 0)) | sort)' <<< "$metadata" > /dev/null; then
            echo "::error::PUBLISHED_CRATES does not name exactly the workspace crates that can be published."
            status=1
          fi
          for crate in $PUBLISHED_CRATES; do
            version="$(jq --raw-output --arg crate "$crate" \
              '.packages[] | select(.name == $crate) | .version' <<< "$metadata")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$crate has version ${version:-none}, but the tag is $GITHUB_REF_NAME."
              status=1
            fi
          done
          # Each requirement of a published crate on another published crate.
          requirements="$(jq --raw-output --arg crates "$PUBLISHED_CRATES" '
            ($crates | split(" ")) as $published
            | .packages[] | select(.name | IN($published[])) | .name as $crate
            | .dependencies[] | select(.kind == null and (.name | IN($published[])))
            | "\($crate) \(.name) \(.req)"' <<< "$metadata")"
          while read -r crate dependency requirement; do
            if [ -n "$crate" ] && [ "$requirement" != "^$tag" ]; then
              echo "::error::$crate requires $dependency $requirement, but the tag is $GITHUB_REF_NAME."
              status=1
            fi
          done <<< "$requirements"
          desktop="$(cargo metadata --no-deps --format-version 1 --manifest-path ferrocrypt-desktop/Cargo.toml \
            | jq --raw-output '.packages[] | select(.name == "ferrocrypt-desktop") | .version')"
          if [ "$desktop" != "$tag" ]; then
            echo "::error::ferrocrypt-desktop has version ${desktop:-none}, but the tag is $GITHUB_REF_NAME."
            status=1
          fi
          exit "$status"

  # Release gate: the >4 GiB round-trip test is too slow and disk-hungry
  # (minutes and ~8 GiB of scratch) for every push, so every push skips it. A
  # release runs it in scripts/release_hook.sh before the release commit, and
  # here on the tagged commit, whoever made the tag; scripts/run_all_tests.sh
  # runs it on request. It is the only test that moves more than u32::MAX
  # bytes through real I/O, so it is the only check that catches a u32/usize
  # truncation in the size or progress accounting above 4 GiB. Ubuntu-only:
  # hosted ubuntu runners have the disk headroom, and macOS/Windows runners
  # are tighter and slower.
  large-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Reclaim ~15 GiB of preinstalled toolchains this job never uses, so the
      # ~8 GiB payload plus the release build fit the runner disk with margin.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Run the >4 GiB round-trip test
        run: cargo test --release -p ferrocrypt --test large_file -- --ignored --test-threads=1

  # Release gate: cargo packages the library and the CLI as crates.io will
  # receive them, and builds each package, the CLI against the packaged
  # library. This is the build `cargo publish` would make. It runs here, in a
  # job that cannot obtain a crates.io token, so that no dependency's code runs
  # in the publish job.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      toolchain: ${{ steps.toolchain.outputs.version }}
      checksums: ${{ steps.package.outputs.checksums }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      # The publish job packages the crates again with this exact toolchain
      # and must make the very packages this job built, even if a new stable
      # Rust is released in between.
      - name: Record the toolchain version
        id: toolchain
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Package and build the library and the CLI
        id: package
        run: |
          packages=()
          for crate in $PUBLISHED_CRATES; do
            packages+=(--package "$crate")
          done
          cargo package --locked "${packages[@]}"
          checksums="$(cd target/package && sha256sum -- *.crate)"
          {
            echo "checksums<<END_OF_CHECKSUMS"
            echo "$checksums"
            echo "END_OF_CHECKSUMS"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, fuzz, version, large-file, package]
    strategy:
      # One target's failure must not cancel the others: a tag build is
      # expensive to reach and every remaining artifact is evidence about
      # what went wrong. Nothing incomplete can escape, because `publish`,
      # and `release` after it, require the whole matrix to have succeeded.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Statically linked Linux CLI builds. They carry their own C
          # library, so one file runs on any Linux machine of that
          # processor family: Alpine and other musl distributions,
          # minimal container images, and distributions whose glibc is
          # older than the build machine's. `cli_only` skips the desktop
          # app, which needs a system graphics stack that no
          # self-contained binary can carry. The aarch64 build runs on an
          # arm64 runner rather than cross-compiling, so it is linked and
          # smoke-tested on the processor it ships for.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cli_only: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cli_only: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installs the toolchain rather than adding a target to whatever the
      # runner image ships, because the arm64 Linux image carries a
      # smaller tool set than the others and need not have Rust at all.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cli_only
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev

      # cargo-bundle 0.12.0 rejects `osx_minimum_system_version` in
      # ferrocrypt-desktop/Cargo.toml and expects `minimum_system_version`
      # under `[package.metadata.bundle.osx]` instead. Move that key before
      # raising the version here and in README.md.
      - name: Install cargo-bundle
        if: ${{ !matrix.cli_only }}
        run: cargo install cargo-bundle --version 0.11.0 --locked

      # ── CLI (workspace member) ──────────────────────────────────────────

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p ferrocrypt-cli

      # ── Static-linkage checks (musl targets) ────────────────────────────

      # A build that quietly picked up a dynamic dependency would still
      # run on this runner and fail only on the user's machine, so the
      # claim is checked here rather than assumed. `readelf` states it
      # exactly: a self-contained binary names no interpreter to load it
      # and lists no libraries to load. The wording of `file` and `ldd`
      # differs between the two targets, so neither is used for the test.
      - name: Verify the CLI has no dynamic dependencies
        if: ${{ matrix.cli_only }}
        run: |
          if ! command -v readelf > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes binutils
          fi
          binary="target/${{ matrix.target }}/release/ferrocrypt"
          if [ ! -f "$binary" ]; then
            echo "::error::$binary does not exist, so nothing was verified."
            exit 1
          fi
          # Both reports are captured before they are searched. Piping
          # readelf straight into grep would report a failed readelf as
          # "no match found", which is the answer this step exists to
          # refuse to give by accident; a failed capture stops the step.
          headers="$(readelf --program-headers "$binary")"
          dynamic="$(readelf --dynamic "$binary")"
          if printf '%s\n' "$headers" | grep -q INTERP; then
            echo "::error::$binary names a dynamic loader, so it is not self-contained."
            printf '%s\n' "$headers" | grep INTERP
            exit 1
          fi
          if printf '%s\n' "$dynamic" | grep -q NEEDED; then
            echo "::error::$binary depends on shared libraries, so it is not self-contained."
            printf '%s\n' "$dynamic" | grep NEEDED
            exit 1
          fi
          echo "$binary names no loader and needs no shared library."

      # The strongest form of the same claim: an image built from nothing
      # holds this one file, so anything the binary reaches for that it
      # does not carry is absent.
      - name: Run the CLI in an image containing nothing else
        if: ${{ matrix.cli_only }}
        run: |
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/ferrocrypt" "$staging/ferrocrypt"
          printf 'FROM scratch\nCOPY ferrocrypt /ferrocrypt\nENTRYPOINT ["/ferrocrypt"]\n' \
            > "$staging/Dockerfile"
          docker build --tag ferrocrypt-static "$staging"
          docker run --rm ferrocrypt-static --version

      # Encrypt and decrypt for real on a distribution whose only C
      # library is musl and which has no build tooling, which is the
      # machine these artifacts exist for.
      - name: Smoke-test the CLI on Alpine
        if: ${{ matrix.cli_only }}
        run: |
          docker run --rm \
            --volume "$PWD/target/${{ matrix.target }}/release/ferrocrypt:/ferrocrypt:ro" \
            --volume "$PWD/scripts/smoke_static_cli.sh:/smoke_static_cli.sh:ro" \
            alpine:latest /smoke_static_cli.sh /ferrocrypt

      # ── Desktop app (excluded from workspace) ──────────────────────────

      # macOS / Linux desktop bundling via cargo-bundle (.app / .deb).
      # Windows uses cargo-wix instead (separate step below), because
      # cargo-bundle's MSI support is still experimental.
      - name: Bundle Desktop (macOS/Linux)
        if: runner.os != 'Windows' && !matrix.cli_only
        working-directory: ferrocrypt-desktop
        run: cargo bundle --release --target ${{ matrix.target }}

      # cargo bundle leaves the .app with a linker-injected ad-hoc signature
      # whose CodeDirectory claims to seal bundle resources but doesn't, so
      # macOS refuses it with "damaged" instead of the usual "unidentified
      # developer" prompt. Re-sign ad-hoc to seal resources properly; users
      # then get the standard Open Anyway flow via Privacy & Security.
      # Proper Developer ID + notarization is the longer-term fix.
      - name: Re-sign Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - \
            ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx/FerroCrypt.app

      # Windows desktop bundling via cargo-wix (uses the WiX Toolset 3 that's
      # pre-installed on GitHub windows-latest runners). The WiX project lives
      # at ferrocrypt-desktop/wix/main.wxs and was generated with `cargo wix
      # init`.
      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix

      - name: Bundle Desktop (Windows MSI)
        if: runner.os == 'Windows'
        working-directory: ferrocrypt-desktop
        run: cargo wix --target ${{ matrix.target }} --nocapture

      # ── Package ─────────────────────────────────────────────────────────

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ferrocrypt-cli-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ferrocrypt

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ferrocrypt-cli-${{ matrix.target }}.zip \
            ./target/${{ matrix.target }}/release/ferrocrypt.exe

      - name: Package Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          cd ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/osx
          zip -r "$GITHUB_WORKSPACE/FerroCrypt-${{ matrix.target }}.zip" FerroCrypt.app

      - name: Package Desktop (linux)
        if: runner.os == 'Linux' && !matrix.cli_only
        run: cp ferrocrypt-desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb FerroCrypt-${{ matrix.target }}.deb

      - name: Package Desktop (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp ferrocrypt-desktop/target/wix/*.msi FerroCrypt-${{ matrix.target }}.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferrocrypt-${{ matrix.target }}
          path: |
            ferrocrypt-cli-${{ matrix.target }}.*
            FerroCrypt-${{ matrix.target }}.*

  # Runs only after every check and every build: a version reaches crates.io
  # only when it has passed the whole suite and its CLI and desktop app are
  # built for the GitHub release. Any code run in this job could obtain a
  # crates.io token, so it builds nothing: the `package` job built every crate
  # it publishes. cargo uploads the library first, as the CLI depends on it,
  # and waits until crates.io lists it.
  publish:
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # crates.io gives a token only to a job in this environment, which
    # RELEASE.md limits to release tags.
    environment: release
    permissions:
      contents: read
      # Trades the run's identity for a short-lived crates.io token.
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The history of `main`, to check that the commit is on it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the toolchain the package job used
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: ${{ needs.package.outputs.toolchain }}

      - name: Check that the tag still names this commit, and that it is on main
        run: scripts/check_release_commit.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

      # Before the job signs in to crates.io: without building anything, cargo
      # must make the very packages the `package` job built.
      - name: Package the crates again and compare them
        env:
          BUILT: ${{ needs.package.outputs.checksums }}
        run: |
          packages=()
          for crate in $PUBLISHED_CRATES; do
            packages+=(--package "$crate")
          done
          cargo package --locked --no-verify "${packages[@]}"
          if ! (cd target/package && sha256sum --check --strict <<< "$BUILT"); then
            echo "::error::These packages differ from the ones the package job built."
            exit 1
          fi

      # A crate already at this version is skipped when crates.io holds the
      # very package made here, as after an earlier attempt to release this
      # commit; any other package at this version stops the release.
      - name: Find the crates still to publish
        id: plan
        run: |
          version="${GITHUB_REF_NAME#v}"
          agent='ferrocrypt release workflow (https://github.com/alexylon/ferrocrypt)'
          missing=()
          for crate in $PUBLISHED_CRATES; do
            response="$RUNNER_TEMP/$crate-$version.json"
            if ! status="$(curl --silent --show-error --retry 3 --retry-all-errors --output "$response" \
                --write-out '%{http_code}' --user-agent "$agent" "https://crates.io/api/v1/crates/$crate/$version")"; then
              echo "::error::crates.io could not be asked for $crate $version. Re-run this job in a few minutes."
              exit 1
            fi
            case "$status" in
              200)
                published="$(jq --raw-output '.version.checksum' "$response")"
                packaged="$(sha256sum "target/package/$crate-$version.crate" | cut -d ' ' -f 1)"
                if [ "$published" != "$packaged" ]; then
                  echo "::error::$crate $version is already on crates.io, and it is not the package this commit makes."
                  exit 1
                fi
                echo "$crate $version is already on crates.io, as the package this commit makes."
                ;;
              404)
                # crates.io trusts a workflow only for a crate it already has,
                # so this job cannot publish a crate's first version.
                if ! known="$(curl --silent --show-error --retry 3 --retry-all-errors --output /dev/null \
                    --write-out '%{http_code}' --user-agent "$agent" "https://crates.io/api/v1/crates/$crate")"; then
                  echo "::error::crates.io could not be asked for $crate. Re-run this job in a few minutes."
                  exit 1
                fi
                case "$known" in
                  200)
                    ;;
                  404)
                    echo "::error::$crate is not on crates.io yet; publish its first version by hand, as RELEASE.md describes."
                    exit 1
                    ;;
                  *)
                    echo "::error::crates.io answered HTTP $known when asked for $crate."
                    exit 1
                    ;;
                esac
                missing+=("$crate")
                ;;
              *)
                echo "::error::crates.io answered HTTP $status when asked for $crate $version."
                exit 1
                ;;
            esac
          done
          echo "crates=${missing[*]}" >> "$GITHUB_OUTPUT"

      - name: Sign in to crates.io
        if: steps.plan.outputs.crates != ''
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the crates still to publish
        if: steps.plan.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          CRATES: ${{ steps.plan.outputs.crates }}
        run: |
          # Again, right before the upload, as the tag may have moved since.
          scripts/check_release_commit.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
          packages=()
          for crate in $CRATES; do
            packages+=(--package "$crate")
          done
          cargo publish --locked --no-verify "${packages[@]}"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # In a folder of its own, apart from the archives the release attaches.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          # The history of `main`, to check that the commit is on it.
          fetch-depth: 0
          persist-credentials: false

      # Again, as the tag may have moved since the publish job checked it.
      - name: Check that the tag still names this commit, and that it is on main
        working-directory: source
        run: scripts/check_release_commit.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ferrocrypt-cli-*
            FerroCrypt-*
