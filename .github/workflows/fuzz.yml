name: Fuzz (reusable)

on:
  workflow_call:
    inputs:
      max_total_time:
        description: "Per-target libfuzzer time budget in seconds."
        type: number
        required: false
        default: 60

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferrocrypt-lib/fuzz

      - name: Install cargo-fuzz
        # No `--locked`: cargo-fuzz 0.13.1's published Cargo.lock pins
        # rustix 0.36.5, which uses gated `rustc_attrs` internals that
        # current nightly rejects. Letting cargo resolve fresh deps picks
        # rustix 1.x, which compiles cleanly. Reproducibility cost is
        # acceptable for a CI build tool that is not a project dependency.
        run: cargo install cargo-fuzz

      - name: Clippy fuzz crate
        working-directory: ferrocrypt-lib/fuzz
        run: cargo +nightly clippy --all-targets -- -D warnings

      - name: Build every fuzz target
        working-directory: ferrocrypt-lib/fuzz
        run: cargo +nightly fuzz build

      - name: Run parser-surface targets (${{ inputs.max_total_time }}s each)
        working-directory: ferrocrypt-lib/fuzz
        env:
          MAX_TOTAL_TIME: ${{ inputs.max_total_time }}
        run: |
          set -euo pipefail
          # Every target except the two integration-level ones that run
          # a full Argon2id derivation per iteration — those are too
          # slow for a per-PR time budget. They're still built above, so
          # API drift still fails the job.
          skip='^(fuzz_symmetric_decrypt|fuzz_hybrid_decrypt)$'
          # Capture to a variable so `set -e` trips if `fuzz list` fails.
          # Command substitution inside a `for ... in $(...)` word list
          # is not subject to fail-fast in bash.
          targets=$(cargo +nightly fuzz list)
          if [[ -z "$targets" ]]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          for target in $targets; do
            if [[ "$target" =~ $skip ]]; then
              echo "=== $target (skipped: integration-level) ==="
              continue
            fi
            echo "=== $target ==="
            cargo +nightly fuzz run "$target" -- -max_total_time="$MAX_TOTAL_TIME"
          done

      - name: Upload fuzz crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            ferrocrypt-lib/fuzz/artifacts/
            ferrocrypt-lib/fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 14
