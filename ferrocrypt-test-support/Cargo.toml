[package]
name = "ferrocrypt-test-support"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
publish = false

description = "Workspace-internal test helpers for ferrocrypt. Not published."
authors = ["Alexander Alexandrov"]
license = "GPL-3.0-only"

[dependencies]
ferrocrypt = { path = "../ferrocrypt-lib" }
# Digests of the wire conformance corpus. Keep this at the sha3 version
# ferrocrypt-lib pins, so the workspace builds one sha3.
sha3 = "0.11"
tempfile = "3"
