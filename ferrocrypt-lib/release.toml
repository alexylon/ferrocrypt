# Package-specific release config for ferrocrypt (lib).
# Paths in [[pre-release-replacements]] are relative to this package directory.
# CHANGELOG lives at the workspace root; ferrocrypt-desktop is excluded from
# the workspace and therefore not handled by shared-version, so its version is
# synced here.

[[pre-release-replacements]]
file = "../CHANGELOG.md"
search = "(?m)^## \\[Unreleased\\]\\n\\n"
replace = """## [Unreleased]

## [{{version}}] - {{date}}

"""

[[pre-release-replacements]]
file = "../ferrocrypt-desktop/Cargo.toml"
search = '^version = ".*"'
replace = 'version = "{{version}}"'
exactly = 1
