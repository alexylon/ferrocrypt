name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Invoked by release.yml as a release gate so a tag build cannot
  # publish artifacts unless this whole suite passes on the tagged commit.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build workspace
        run: cargo build --verbose

      - name: Run workspace tests
        # Strict-mode flag for Windows: fail closed if symlink_dir /
        # symlink_file privilege is missing instead of silently
        # skipping the hardened-extractor symlink/junction tests in
        # `archive/platform.rs::tests`. github-hosted windows-latest
        # runners ship Developer Mode enabled, so these tests run
        # unconditionally there. `mklink /J` (junction creation) does
        # not require any privilege flag — runs on any account.
        #
        # `--include-ignored` runs the `#[ignore = "fs-matrix"]` smoke
        # tests on the default filesystem too, so the build job has
        # the same coverage the fs_matrix lanes have on alternative
        # filesystems. The `--skip`s exclude the ignored tests that are
        # not meant for this fast, every-push lane:
        # `regenerate_fixtures` deletes and rewrites
        # `tests/fixtures/`, racing against the four
        # `decrypt_*_fixture_matches_source` tests when run alongside
        # them; `regenerate_suite_vectors` rewrites
        # `testvectors/suite/` — running it here would make
        # `testvector_suite` replay the freshly generated corpus
        # instead of the committed one the corpus exists to pin; and
        # `round_trip_file_larger_than_4gib` moves >4 GiB through real
        # I/O (minutes and ~8 GiB of disk), so every push skips it. It runs
        # as a release gate instead (the `large-file` job in `release.yml`),
        # and locally via `FERROCRYPT_GAUNTLET_LARGE_FILE=1` in
        # `run_all_tests.sh`.
        env:
          FERROCRYPT_REQUIRE_WINDOWS_SYMLINK_TESTS: "1"
        run: cargo test --verbose -- --test-threads=1 --include-ignored --skip regenerate_fixtures --skip regenerate_suite_vectors --skip round_trip_file_larger_than_4gib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # master
        with:
          toolchain: 1.87.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build ferrocrypt-lib on MSRV
        run: cargo build -p ferrocrypt --verbose

      - name: Test ferrocrypt-lib on MSRV
        run: cargo test -p ferrocrypt --verbose

  # ferrocrypt-cli's MSRV is 1.89: rustyline 18 uses the `file_lock` std
  # feature, stable since 1.89 (home 0.5.12 needs only 1.88; the higher bound
  # wins). The library's MSRV is 1.87, so the CLI gets its own lane on its own
  # toolchain — the `msrv` job above builds only the library on 1.87.
  msrv-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # master
        with:
          toolchain: 1.89.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build ferrocrypt-cli on MSRV
        run: cargo build -p ferrocrypt-cli --verbose

      - name: Test ferrocrypt-cli on MSRV
        run: cargo test -p ferrocrypt-cli --verbose

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check version terminology
        run: ./check_terminology.sh

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy with fuzzing feature
        run: cargo clippy --package ferrocrypt --features fuzzing --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run dependency audit
        run: cargo audit

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Install cargo-vet
        run: cargo install cargo-vet

      - name: Run supply-chain vet
        run: cargo vet

  # Public-API compatibility gate for the `ferrocrypt` library.
  # Compares the in-tree public API against the latest stable release
  # on crates.io and fails on any change the version number does not
  # allow. Pre-release versions promise nothing, so they are never
  # used as the baseline: while a 0.3.0-rc.x is the newest publish,
  # the baseline stays 0.2.5 and the 0.2 -> 0.3 bump already permits
  # intentional breaks; the day 0.3.0 ships, the baseline becomes
  # 0.3.0 and any unannounced API break fails this job.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks

      - name: Resolve the latest stable release as the baseline
        # The versions endpoint lists newest first, so the first entry
        # that is not yanked and has no pre-release suffix is the
        # latest stable release.
        run: |
          baseline="$(curl --silent --fail \
            --header 'User-Agent: ferrocrypt-ci (github.com/alexylon/ferrocrypt)' \
            https://crates.io/api/v1/crates/ferrocrypt/versions \
            | jq --raw-output \
              '[.versions[] | select(.yanked | not) | .num | select(contains("-") | not)][0]')"
          if [ -z "$baseline" ] || [ "$baseline" = "null" ]; then
            echo "No stable release found on crates.io to compare against." >&2
            exit 1
          fi
          echo "Baseline: $baseline"
          echo "SEMVER_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Check the public API against the baseline
        run: cargo semver-checks --package ferrocrypt --baseline-version "$SEMVER_BASELINE"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ferrocrypt-desktop

      - name: Install Slint system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libfreetype-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev

      - name: Clippy ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Build ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo build --verbose

      - name: Test ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo test --verbose -- --test-threads=1

  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      # 20s/target on PR. libfuzzer-mutator's discovery curve flattens
      # after the first ~10s, so the marginal coverage from running
      # longer is small. The release-gate in `release.yml` calls the
      # same reusable workflow with 60s for a tougher pre-ship check.
      max_total_time: 20

  # Filesystem-matrix smoke tests. Each lane mounts a non-default
  # filesystem, points FERROCRYPT_FS_MATRIX_DIR at the mount, and runs
  # the small set of `#[ignore = "fs-matrix"]` tests in
  # `ferrocrypt-lib/tests/archive_fs_matrix.rs`. The default 3-platform
  # matrix above already covers the common-case filesystems
  # (ext4/APFS-CI/NTFS); these lanes catch regressions on filesystems
  # FerroCrypt advertises support for but doesn't otherwise exercise.
  fs_matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Case-sensitive APFS: distinct case-only-different filenames
          # are no longer the same file. Catches regressions in
          # extraction's ASCII-case-insensitive dedup that a default
          # macOS runner can't reach.
          - name: macos-apfs-cs
            os: macos-latest
            mount_setup: |
              hdiutil create -size 200m -fs "Case-sensitive APFS" -volname FCAFsMatrix /tmp/fsmatrix.dmg
              hdiutil attach /tmp/fsmatrix.dmg
              echo "FERROCRYPT_FS_MATRIX_DIR=/Volumes/FCAFsMatrix" >> "$GITHUB_ENV"
            mount_teardown: hdiutil detach /Volumes/FCAFsMatrix || true
          # macOS exFAT: the Apple exFAT driver has no
          # renameatx_np(RENAME_EXCL), so decrypt promotion and encrypt
          # finalization take the claim-then-rename fallback here. This
          # is the "decrypt onto a USB stick on a Mac" scenario; the
          # Linux and Windows exFAT lanes use different kernel drivers
          # that never reach the fallback.
          # The volume name MUST stay at 11 characters or fewer: exFAT
          # labels are capped there, and macOS silently drops a longer
          # label and mounts the volume at "/Volumes/NO NAME", so the
          # lane would point FERROCRYPT_FS_MATRIX_DIR at a nonexistent
          # path.
          - name: macos-exfat
            os: macos-latest
            mount_setup: |
              hdiutil create -size 200m -fs ExFAT -volname FCAFSMEXFAT /tmp/fsmatrix-exfat.dmg
              hdiutil attach /tmp/fsmatrix-exfat.dmg
              echo "FERROCRYPT_FS_MATRIX_DIR=/Volumes/FCAFSMEXFAT" >> "$GITHUB_ENV"
            mount_teardown: hdiutil detach /Volumes/FCAFSMEXFAT || true
          # Linux btrfs: copy-on-write semantics, snapshot-aware.
          # Different inode allocator and rename behavior than ext4.
          - name: linux-btrfs
            os: ubuntu-latest
            mount_setup: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends btrfs-progs
              dd if=/dev/zero of=/tmp/fsmatrix.img bs=1M count=200
              sudo mkfs.btrfs /tmp/fsmatrix.img
              sudo mkdir -p /mnt/fsmatrix
              sudo mount -o loop /tmp/fsmatrix.img /mnt/fsmatrix
              sudo chown "$(whoami)" /mnt/fsmatrix
              echo "FERROCRYPT_FS_MATRIX_DIR=/mnt/fsmatrix" >> "$GITHUB_ENV"
            mount_teardown: sudo umount /mnt/fsmatrix || true
          # Linux exFAT: no Unix permission semantics. Validates that
          # extraction (which chmods every file) doesn't error on a
          # filesystem where the chmod is structurally a no-op.
          #
          # The mount uses the kernel exfat driver (mainline since
          # Linux 5.4, present on GH Actions ubuntu-latest). The
          # driver is shipped as a module that isn't auto-loaded, so
          # modprobe is explicit. `linux-modules-extra-$(uname -r)`
          # is installed best-effort in case a future runner image
          # ships a kernel without the module built in.
          - name: linux-exfat
            os: ubuntu-latest
            mount_setup: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends exfatprogs
              sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
              sudo modprobe exfat
              dd if=/dev/zero of=/tmp/fsmatrix.img bs=1M count=200
              sudo mkfs.exfat /tmp/fsmatrix.img
              sudo mkdir -p /mnt/fsmatrix
              sudo mount -t exfat -o loop,uid="$(id -u)",gid="$(id -g)" /tmp/fsmatrix.img /mnt/fsmatrix
              echo "FERROCRYPT_FS_MATRIX_DIR=/mnt/fsmatrix" >> "$GITHUB_ENV"
            mount_teardown: sudo umount /mnt/fsmatrix || true
          # Windows NTFS: the default Windows filesystem. Somewhat
          # redundant with `build.windows-latest` (which already runs
          # the full lib + integration suite on NTFS) but kept in the
          # matrix for symmetry — one job listing every supported
          # filesystem is easier to audit. The lane creates a fresh
          # NTFS-backed directory rather than reusing %TEMP% so the
          # path the test exercises is unambiguous.
          #
          # Both Windows lanes assume the default shell for `run:` on
          # `windows-latest` (pwsh, i.e. PowerShell 7+). Do NOT switch
          # them to Windows PowerShell 5.1 via `shell: powershell` —
          # PS 5.1's `Out-File -Encoding utf8` writes a UTF-8 BOM,
          # which lands in `$GITHUB_ENV` and breaks subsequent env
          # reads. pwsh 7+ writes BOM-less UTF-8.
          - name: windows-ntfs
            os: windows-latest
            mount_setup: |
              New-Item -Path C:\fsmatrix-ntfs -ItemType Directory -Force | Out-Null
              "FERROCRYPT_FS_MATRIX_DIR=C:\fsmatrix-ntfs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            mount_teardown: Remove-Item -Recurse -Force C:\fsmatrix-ntfs -ErrorAction SilentlyContinue
          # Windows exFAT: distinct kernel driver from the Linux exfat
          # driver. Real users exercise this code path when extracting
          # an archive onto a USB stick formatted on a Windows box.
          # Hyper-V cmdlets create a 200 MB VHD, format it exFAT, and
          # assign a drive letter automatically.
          - name: windows-exfat
            os: windows-latest
            mount_setup: |
              $ErrorActionPreference = "Stop"
              $vhdPath = "C:\fsmatrix.vhd"
              New-VHD -Path $vhdPath -SizeBytes 200MB -Dynamic | Out-Null
              $vhd = Mount-VHD -Path $vhdPath -Passthru
              $disk = Get-Disk -Number $vhd.DiskNumber
              Initialize-Disk -Number $disk.Number -PartitionStyle MBR
              $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -AssignDriveLetter
              Format-Volume -DriveLetter $part.DriveLetter -FileSystem exFAT -Confirm:$false | Out-Null
              "FERROCRYPT_FS_MATRIX_DIR=$($part.DriveLetter):\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            mount_teardown: Dismount-VHD -Path C:\fsmatrix.vhd -ErrorAction SilentlyContinue
          # macOS loopback SMB: the macOS SMB client has no
          # renameatx_np(RENAME_EXCL), so encrypt finalization and
          # decrypt promotion take the claim-then-rename fallback, and
          # smbfs rejects F_FULLFSYNC and directory fsync, so the
          # durability helpers take their documented downgrade
          # branches. This is the "decrypt onto a NAS share from a
          # Mac" scenario; no other lane reaches these paths. The
          # share is served by the runner itself (impacket's Python
          # SMB server, which needs no root) and mounted back over
          # loopback, so no second machine is involved.
          - name: macos-smb
            os: macos-latest
            mount_setup: |
              python3 -m venv /tmp/impacket-venv
              /tmp/impacket-venv/bin/pip install --quiet impacket
              mkdir -p /tmp/smb-share /tmp/smb-mnt
              /tmp/impacket-venv/bin/smbserver.py -smb2support -port 1445 \
                -username fcr -password fcrtest SHARE /tmp/smb-share \
                > /tmp/smbserver.log 2>&1 &
              echo $! > /tmp/smbserver.pid
              # Mounting before the server listens fails with a
              # connection refusal, so wait for the port first.
              for _ in $(seq 1 30); do
                nc -z 127.0.0.1 1445 && break
                sleep 1
              done
              mount_smbfs '//fcr:fcrtest@127.0.0.1:1445/SHARE' /tmp/smb-mnt \
                || { cat /tmp/smbserver.log; exit 1; }
              echo "FERROCRYPT_FS_MATRIX_DIR=/tmp/smb-mnt" >> "$GITHUB_ENV"
            mount_teardown: |
              umount /tmp/smb-mnt || true
              kill "$(cat /tmp/smbserver.pid)" || true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Mount target filesystem
        run: ${{ matrix.mount_setup }}

      - name: Run fs-matrix smoke tests
        run: cargo test -p ferrocrypt --test archive_fs_matrix -- --ignored --test-threads=1

      - name: Unmount target filesystem
        if: always()
        run: ${{ matrix.mount_teardown }}
