name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --verbose

      - name: Run workspace tests
        # Strict-mode flag for Windows: fail closed if symlink_dir /
        # symlink_file privilege is missing instead of silently
        # skipping the hardened-extractor symlink/junction tests in
        # `archive/platform.rs::tests`. github-hosted windows-latest
        # runners ship Developer Mode enabled, so these tests run
        # unconditionally there. `mklink /J` (junction creation) does
        # not require any privilege flag — runs on any account.
        env:
          FERROCRYPT_REQUIRE_WINDOWS_SYMLINK_TESTS: "1"
        run: cargo test --verbose -- --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ferrocrypt-lib on MSRV
        run: cargo build -p ferrocrypt --verbose

      - name: Test ferrocrypt-lib on MSRV
        run: cargo test -p ferrocrypt --verbose

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy with fuzzing feature
        run: cargo clippy --package ferrocrypt --features fuzzing --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run dependency audit
        run: cargo audit

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-vet
        run: cargo install --locked cargo-vet

      - name: Run supply-chain vet
        run: cargo vet

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferrocrypt-desktop

      - name: Install Slint system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libfreetype-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev

      - name: Clippy ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Build ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo build --verbose

      - name: Test ferrocrypt-desktop
        working-directory: ferrocrypt-desktop
        run: cargo test --verbose -- --test-threads=1

  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 60
