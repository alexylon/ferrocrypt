[package]
name = "ferrocrypt-desktop"
version = "0.3.0-rc.3"
edition = "2021"
description = "Desktop application for FerroCrypt — passphrase and public-key file/directory encryption."
authors = ["Alexander Alexandrov"]
license = "GPL-3.0-only"
publish = false

[dependencies]
slint = "1"
ferrocrypt = { path = "../ferrocrypt-lib" }
rfd = "0.17"
regex-lite = "0.1"
arboard = "3"

# Test-only fast Argon2id parameters (19 MiB floor) so the dispatch test does
# not pay the 1 GiB production KDF. Not published (this crate is publish = false).
[dev-dependencies]
ferrocrypt-test-support = { path = "../ferrocrypt-test-support" }

[build-dependencies]
slint-build = "1"

# cargo-wix is used for the Windows MSI build (cargo-bundle's MSI backend is
# unimplemented). Suppress the EULA dialog (license-screen) for the installer;
# the GPL-3.0 text is shipped with the binary, not as an installer screen.
[package.metadata.wix]
eula = false

[package.metadata.bundle]
name = "FerroCrypt"
identifier = "app.ferrocrypt"
icon = ["assets/app_icon.png"]
resources = ["assets"]
category = "Developer Tool"
short_description = "FerroCrypt desktop app"

# macOS-specific
osx_minimum_system_version = "12.0"
